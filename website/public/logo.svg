<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Gold circle border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#C4963C" stroke-width="10"/>
  <circle cx="100" cy="100" r="85" fill="white"/>

  <!-- Bamboo stems -->
  <!-- Left bamboo -->
  <rect x="65" y="50" width="10" height="110" rx="3" fill="#2D7D46"/>
  <rect x="65" y="75" width="10" height="3" fill="#1a5c30"/>
  <rect x="65" y="110" width="10" height="3" fill="#1a5c30"/>

  <!-- Center bamboo -->
  <rect x="95" y="35" width="10" height="125" rx="3" fill="#3a9d5e"/>
  <rect x="95" y="65" width="10" height="3" fill="#2D7D46"/>
  <rect x="95" y="100" width="10" height="3" fill="#2D7D46"/>
  <rect x="95" y="130" width="10" height="3" fill="#2D7D46"/>

  <!-- Right bamboo -->
  <rect x="125" y="55" width="10" height="100" rx="3" fill="#2D7D46"/>
  <rect x="125" y="85" width="10" height="3" fill="#1a5c30"/>
  <rect x="125" y="120" width="10" height="3" fill="#1a5c30"/>

  <!-- Bamboo leaves -->
  <ellipse cx="58" cy="48" rx="15" ry="5" fill="#3a9d5e" transform="rotate(-35 58 48)"/>
  <ellipse cx="82" cy="42" rx="13" ry="4" fill="#2D7D46" transform="rotate(25 82 42)"/>
  <ellipse cx="110" cy="33" rx="14" ry="4.5" fill="#3a9d5e" transform="rotate(30 110 33)"/>
  <ellipse cx="88" cy="32" rx="12" ry="4" fill="#2D7D46" transform="rotate(-20 88 32)"/>
  <ellipse cx="138" cy="52" rx="13" ry="4" fill="#3a9d5e" transform="rotate(35 138 52)"/>
  <ellipse cx="120" cy="48" rx="11" ry="3.5" fill="#2D7D46" transform="rotate(-30 120 48)"/>
</svg>
